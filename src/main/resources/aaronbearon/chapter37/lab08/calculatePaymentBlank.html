<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Calculator</title>
    <style>
        label {
            display: inline-block;
            width: 135px;
        }
        .result {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
<h1>Loan Calculator using Servlet</h1>
<form action="calculatePayment" method="post" novalidate>
    <div style="margin: 2px; border: 2px; padding: 2px;">
        <label for="loanAmount">Loan Amount:</label>
        <input type="number" step="1000" id="loanAmount" name="loanAmountStr" value="1000">
    </div>
    <div style="margin: 2px; border: 2px; padding: 2px;">
        <label for="interestRate">Annual Interest Rate</label>
        <input type="number" step="0.1" id="interestRate" name="interestRateStr" value="2.5">
    </div>
    <div style="margin: 2px; border: 2px; padding: 2px;">
        <label for="loanYears">Number of Years</label>
        <input type="number" step="1" id="loanYears" name="loanYearsStr" value="1">
    </div>
    <div style="display: flex; gap: 0;">
        <button type="submit">Compute Loan Payment</button>
        <button type="reset">Reset</button>
    </div>
</form>
</body>
</html>
