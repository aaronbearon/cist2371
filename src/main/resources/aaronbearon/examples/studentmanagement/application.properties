spring.application.name=StudentManagement

#Thymeleaf templates live alongside the rest of this app's package, not the shared classpath root:
spring.thymeleaf.prefix=classpath:/aaronbearon/examples/studentmanagement/templates/

#MySQL Connection:
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb
spring.datasource.username=root
spring.datasource.password=password
## TODO: create a dedicated username and password in MySQL for this schema?
# spring.datasource.username=studentapp
# spring.datasource.password=Student2026$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA Configuration:
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
