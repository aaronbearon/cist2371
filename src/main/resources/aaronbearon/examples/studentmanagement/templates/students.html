<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
    <title>Student Management System</title>
</head>
<body>
<h1>Student Management System</h1>
<p><a th:href="@{/students/new}">Add Student</a></p>
<h2>Search Students</h2>
<form th:action="@{/}" method="get">
    <label for="lastName">LastName</label>
    <input type="text" id="lastName" name="lastName" th:value="${lastName}">
    <button type="submit">Search</button>

    <a th:href="@{/}">Clear Search</a>
</form>
<h2>Student Records</h2>
<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student: ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.firstName}"></td>
        <td th:text="${student.lastName}"></td>
        <td th:text="${student.email}"></td>
        <td><a th:href ="@{/students/edit/{id}(id=${student.id})}">Edit</a>

        <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post" style="display:inline">
            <button type="submit">Delete</button>
        </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(students)}">
        <td colspan="5">No Students found</td>
    </tr>
    </tbody>
</table>
</body>
</html>
